<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e3e68">
  <title>กำลังออฟไลน์ — บวรไทย</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #eff1ec; color: #1c2333; font-family: system-ui, sans-serif; }
    main { width: min(100%, 480px); border: 1px solid #dbdfd5; border-radius: 28px; background: white; padding: 36px 28px; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    .brand { color: #2e3e68; font-weight: 700; letter-spacing: .04em; }
    h1 { margin: 24px 0 12px; font-size: 28px; }
    p { line-height: 1.9; }
    .detail { color: #5b6478; font-size: 14px; }
    a { display: flex; min-height: 48px; align-items: center; justify-content: center; margin-top: 24px; padding: 12px 20px; border-radius: 12px; background: #2e3e68; color: white; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #c97418; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="บวรไทย">
    <p class="brand">บวรไทย DELIVERY</p>
    <h1>ตอนนี้ยังไม่มีอินเทอร์เน็ต</h1>
    <p>เชื่อมต่อ Wi-Fi หรืออินเทอร์เน็ตมือถือ แล้วกลับมาค้นหาตำบลและใช้งานอีกครั้ง</p>
    <p class="detail">การสั่งสินค้าและติดตามออเดอร์ต้องเชื่อมต่อระบบ ข้อมูลและคำสั่งที่ยังไม่ได้ส่งจะไม่ถูกยืนยันจากหน้านี้</p>
    <a href="/delivery">เชื่อมต่อแล้ว ลองอีกครั้ง</a>
  </main>
</body>
</html>

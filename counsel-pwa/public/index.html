<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ที่ปรึกษา</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { --fg:#1d1d1b; --muted:#6b6a64; --bg:#faf9f5; --card:#ffffff; --line:#e4e2da; --accent:#2f5d50; --crisis:#9a3412; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --fg:#ecebe6; --muted:#a3a198; --bg:#1b1c1a; --card:#252623; --line:#3a3b37; --accent:#7fb8a5; --crisis:#fdba74; }
    }
    :root[data-theme="dark"] { --fg:#ecebe6; --muted:#a3a198; --bg:#1b1c1a; --card:#252623; --line:#3a3b37; --accent:#7fb8a5; --crisis:#fdba74; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, "Sarabun", "Noto Sans Thai", sans-serif; font-size:16px; line-height:1.6; }
    main { max-width:560px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; min-height:100vh; }
    h1 { font-size:22px; font-weight:500; margin:8px 0 0; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
    input, select, textarea { width:100%; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    button { font:inherit; border:0; border-radius:8px; padding:12px 14px; background:var(--accent); color:#fff; cursor:pointer; }
    button.secondary { background:transparent; color:var(--fg); border:1px solid var(--line); }
    button:disabled { opacity:.5; cursor:default; }
    #status { font-size:14px; color:var(--muted); }
    #talk { font-size:16px; color:var(--accent); margin:4px 0 0; min-height:1.6em; }
    [hidden] { display:none !important; }
    /* วงกลม NOVA: ขยายตามเสียงไมค์ตอนฟัง เต้นเป็นจังหวะตอนพูด */
    #orb { width:120px; height:120px; margin:8px auto 0; border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #9fe3d0, var(--accent) 60%, #1f3f37);
      box-shadow:0 0 calc(12px + var(--lvl, 0) * 60px) color-mix(in srgb, var(--accent) 70%, transparent);
      transform:scale(calc(0.85 + var(--lvl, 0) * 0.35)); transition:transform .08s linear, box-shadow .08s linear; }
    #orb.idle { opacity:.45; }
    #orb.speaking { animation:pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { transform:scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { #orb, #orb.speaking { animation:none; transition:none; } }
    #log { display:flex; flex-direction:column; gap:8px; min-height:160px; max-height:52vh; overflow-y:auto; }
    #log p { margin:0; padding:8px 10px; border-radius:10px; max-width:88%; white-space:pre-wrap; }
    #log .bot { background:var(--bg); border:1px solid var(--line); align-self:flex-start; }
    #log .user, #log .me { background:var(--accent); color:#fff; align-self:flex-end; }
    #log .crisis { background:transparent; border:1px solid var(--crisis); color:var(--crisis); align-self:stretch; max-width:100%; }
    #log .sys { color:var(--muted); font-size:14px; align-self:center; }
    #log .src { color:var(--muted); font-size:13px; align-self:stretch; max-width:100%; border-left:3px solid var(--line); border-radius:0; }
    .hint { font-size:13px; color:var(--muted); margin:0; }
  </style>
</head>
<body>
<main>
  <h1 id="title" data-t="title">ที่ปรึกษา</h1>

  <div id="orb" hidden aria-hidden="true"></div>

  <section class="card">
    <!-- ภาษาสนทนา: ตัวหนังสือบนหน้าเป็นไทยเมื่อเลือกไทย ภาษาอื่นเป็นอังกฤษ ป้ายนี้คงสองภาษาให้ทุกคนหาเจอ -->
    <label for="lang">ภาษา · Language</label>
    <select id="lang">
      <option value="auto" data-t="langAuto">อัตโนมัติ (ตามภาษาที่พูด)</option>
      <option value="th">ไทย (Thai)</option>
      <option value="en">English</option>
      <option value="zh">中文 (Chinese)</option>
      <option value="ja">日本語 (Japanese)</option>
      <option value="ko">한국어 (Korean)</option>
      <option value="lo">ລາວ (Lao)</option>
      <option value="my">မြန်မာ (Burmese)</option>
      <option value="km">ខ្មែរ (Khmer)</option>
      <option value="vi">Tiếng Việt (Vietnamese)</option>
      <option value="hi">हिन्दी (Hindi)</option>
      <option value="de">Deutsch (German)</option>
      <option value="fr">Français (French)</option>
      <option value="es">Español (Spanish)</option>
    </select>
    <div style="height:10px"></div>
    <label for="token" id="tokenLabel" data-t="tokenLabel">รหัสเชิญ</label>
    <input id="token" type="password" autocomplete="off" placeholder="ใส่รหัสที่ได้รับ" data-tp="tokenPh">
    <div style="height:10px"></div>
    <label for="voice" data-t="voiceLabel">เสียงตอบ (เลือกก่อนกดเริ่ม ถ้าจะเปลี่ยนให้กด จบ ก่อน)</label>
    <select id="voice">
      <optgroup label="เสียง Gemini ผู้หญิง" data-tl="gFemale">
        <option value="Kore" selected>Kore</option>
        <option value="Aoede">Aoede</option>
        <option value="Leda">Leda</option>
        <option value="Zephyr">Zephyr</option>
      </optgroup>
      <optgroup label="เสียง Gemini ผู้ชาย" data-tl="gMale">
        <option value="Puck">Puck</option>
        <option value="Charon">Charon</option>
        <option value="Fenrir">Fenrir</option>
      </optgroup>
    </select>
    <!-- ความเร็วพูด: ใช้ได้กับเสียง Paxa และ ElevenLabs (เสียง Gemini ปรับไม่ได้ ปิดแถบไว้) -->
    <label for="speed"><span data-t="speedLabel">ความเร็วพูด</span> <b id="speedVal">1.00×</b></label>
    <input id="speed" type="range" min="0.7" max="1.2" step="0.05" value="1" style="padding:0">
    <p id="speedNote" class="hint" data-t="speedGemini" hidden>เสียง Gemini ปรับความเร็วไม่ได้ เลือกเสียง Paxa หรือ ElevenLabs ถ้าต้องการปรับ</p>
    <label for="length" data-t="lengthLabel">ความยาวคำตอบ (เลือกก่อนกดเริ่ม)</label>
    <select id="length">
      <option value="1" data-t="len1">๑ สั้นมาก (1-2 ประโยค)</option>
      <option value="2" data-t="len2" selected>๒ สั้น (2-3 ประโยค)</option>
      <option value="3" data-t="len3">๓ กลาง (4-5 ประโยค)</option>
      <option value="4" data-t="len4">๔ ยาว (6-8 ประโยค)</option>
      <option value="5" data-t="len5">๕ ละเอียด (อธิบายครบ)</option>
    </select>
    <div id="earBox" hidden>
      <label for="ear" data-t="earLabel">หูฟัง (เลือกก่อนกดเริ่ม)</label>
      <select id="ear">
        <option value="gemini" data-t="earGemini">Gemini (ฟังต่อเนื่อง ค่าเริ่มต้น)</option>
        <option value="eleven" data-t="earEleven">ElevenLabs (ฟังทีละประโยค รหัสเจ้าของเท่านั้น)</option>
      </select>
    </div>
    <!-- แปลสด: ภาษาของสองคน ใช้กับปุ่ม แปลสด เท่านั้น (app.js เติมรายการภาษาจากช่องภาษาด้านบน) -->
    <label data-t="interpretLabel">แปลสดระหว่างสองคน: ภาษาของคนที่ ๑ และคนที่ ๒</label>
    <div class="row">
      <select id="langA" aria-label="Person 1 language"></select>
      <select id="langB" aria-label="Person 2 language"></select>
    </div>
    <div style="height:12px"></div>
    <label data-t="modeLabel">เลือกโหมดแล้วเริ่มพูดได้เลย</label>
    <div class="row">
      <button class="start" data-mode="counsel" data-t="counsel">ปรึกษาปัญหาชีวิต</button>
      <button class="start" data-mode="dhamma" data-t="dhamma">ถามธรรมะ</button>
      <button class="start" data-mode="interpret" data-t="interpret">แปลสด</button>
      <button class="start" data-mode="nova" data-t="nova" hidden>เริ่มคุยกับ NOVA</button>
    </div>
    <div style="height:8px"></div>
    <button id="stop" class="secondary" disabled style="width:100%" data-t="stop">จบ</button>
    <p id="status">ยังไม่ได้เชื่อมต่อ</p>
    <p id="talk" aria-live="polite"></p>
  </section>

  <section class="card" style="flex:1; display:flex; flex-direction:column; gap:10px">
    <div id="log" aria-live="polite"></div>
    <form id="form" class="row">
      <input id="text" placeholder="พิมพ์ข้อความ" data-tp="textPh" autocomplete="off" maxlength="1000">
      <button type="submit" class="secondary" data-t="send">ส่ง</button>
    </form>
    <label for="wrongFile" style="margin:0" data-t="wrongFileLabel">แนบภาพหรือ PDF ประกอบรายงาน (ถ้ามี ไม่เกิน 10 MB)</label>
    <input id="wrongFile" type="file" accept="image/png,image/jpeg,image/webp,application/pdf">
    <button id="wrong" type="button" class="secondary" data-t="wrong">ตอบไม่ถูก (บันทึกไว้ให้ปรับปรุง)</button>
  </section>

  <p class="hint" data-t="hint">หากมีความคิดทำร้ายตัวเอง โทร 1323 หรือ 1669 ทันที แอปนี้ไม่ใช่การรักษาจากจิตแพทย์หรือนักจิตวิทยา</p>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
